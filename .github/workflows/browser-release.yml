name: browser release

# Publishes Spindle for Browser as a zip on a GitHub release. Push a tag browser-vVERSION,
# where VERSION is spindle/chrome/manifest.json's version; the job builds the extension
# from that commit (the browser Linux included), checks the unpacked zip in Chrome
# against a scripted provider, attests where it was built, and attaches it to the
# tag's release, beside the Chrome Web Store's build of the same commit (ChatGPT signs in
# there only with OpenAI's Sign in with ChatGPT). Running it by hand on an existing tag
# builds and replaces the zips.
on:
  push:
    tags: ["browser-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing browser-v* tag to build again"
        required: true

permissions:
  contents: read

concurrency:
  group: browser-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Version from the manifest
        run: |
          version=$(node -p "require('./spindle/chrome/manifest.json').version")
          if [ "$TAG" != "browser-v$version" ]; then
            echo "tag $TAG does not name the manifest's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=spindle-browser-$version.zip" >> "$GITHUB_ENV"
          echo "STORE_ASSET=spindle-browser-store-$version.zip" >> "$GITHUB_ENV"
          echo "MINIMUM=$(node -p "require('./spindle/chrome/manifest.json').minimum_chrome_version")" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          rustup target add wasm32-unknown-unknown i686-unknown-linux-musl
          # clang compiles SQLite for wasm32 (sqlite-wasm-rs).
          sudo apt-get update
          sudo apt-get install -y clang
          # The browser Linux's boot image is made in a user namespace, which this
          # runner's AppArmor blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' spindle/embed/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$RUNNER_TEMP/wasm-bindgen"
      - name: Build
        working-directory: spindle
        run: |
          chrome/linux/build.sh
          chrome/build.sh "$RUNNER_TEMP/wasm-bindgen/bin/wasm-bindgen"
          cp ../LICENSE chrome/dist/LICENSE
          # The build names no directory of the machine that made it.
          if grep -r -a -l -F -e "$HOME" -e "$GITHUB_WORKSPACE" chrome/dist; then
            echo "build paths in the files above" >&2
            exit 1
          fi
          (cd chrome/dist && zip -q -r -X "$RUNNER_TEMP/$ASSET" .)
          (cd "$RUNNER_TEMP" && sha256sum "$ASSET" > "$ASSET.sha256")
      - name: Check the zip, unpacked, in Chrome
        working-directory: spindle
        run: |
          unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/spindle-browser"
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/extension_real.mjs "$RUNNER_TEMP/spindle-browser" --scripted
          # The focused checks on the same unpacked zip (previews, tasks, sends; a renewed
          # engine giving its memory back), and what it says it is made of: this version,
          # from sources with no changes.
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/review_browser.mjs "$RUNNER_TEMP/spindle-browser"
          node --expose-gc chrome/tests/engine_renew.mjs "$RUNNER_TEMP/spindle-browser/web"
          node -e '
            const build = require(process.argv[1]);
            if (build.version !== process.env.VERSION) throw new Error(`build.json says ${build.version}`);
            for (const part of ["spindle", "engine"]) if (!/^[0-9a-f]{12}$/.test(build[part])) throw new Error(`build.json ${part}: ${build[part]}`);
            console.log(JSON.stringify(build));
          ' "$RUNNER_TEMP/spindle-browser/build.json"
      - name: The Chrome Web Store's build, checked in Chrome
        working-directory: spindle
        run: |
          # Without the ChatGPT sign-in through the Codex CLI's client (build.sh checks
          # none of it is in the files); everything else as the zip above.
          SPINDLE_STORE=1 chrome/build.sh "$RUNNER_TEMP/wasm-bindgen/bin/wasm-bindgen" "$RUNNER_TEMP/store-dist"
          cp ../LICENSE "$RUNNER_TEMP/store-dist/LICENSE"
          if grep -r -a -l -F -e "$HOME" -e "$GITHUB_WORKSPACE" "$RUNNER_TEMP/store-dist"; then
            echo "build paths in the files above" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/store-dist" && zip -q -r -X "$RUNNER_TEMP/$STORE_ASSET" .)
          (cd "$RUNNER_TEMP" && sha256sum "$STORE_ASSET" > "$STORE_ASSET.sha256")
          unzip -q "$RUNNER_TEMP/$STORE_ASSET" -d "$RUNNER_TEMP/spindle-browser-store"
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/extension_real.mjs "$RUNNER_TEMP/spindle-browser-store" --scripted
          node -e '
            const build = require(process.argv[1]);
            if (build.version !== process.env.VERSION || build.edition !== "store") throw new Error(`build.json says ${build.version} ${build.edition}`);
          ' "$RUNNER_TEMP/spindle-browser-store/build.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/${{ env.ASSET }}
            ${{ runner.temp }}/${{ env.STORE_ASSET }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Spindle for Browser $VERSION, for Chrome, Edge and Brave, built from this tag by the browser release workflow.

          **Verify** it before you unzip it: \`sha256sum -c $ASSET.sha256\` (on macOS, \`shasum -a 256 -c $ASSET.sha256\`; on Windows, compare \`Get-FileHash $ASSET\` with the \`.sha256\` file), or \`gh attestation verify $ASSET -R $GITHUB_REPOSITORY\`.

          **Install** (Chrome, Edge or Brave, Chromium $MINIMUM or later, on desktop):

          1. Download \`$ASSET\` and unzip it into a folder you will keep, one without the version in its name.
          2. Open \`chrome://extensions\` (in Edge, \`edge://extensions\`; in Brave, \`brave://extensions\`), turn on **Developer mode**, click **Load unpacked** and choose that folder.
          3. Pin Spindle, open its panel, and in **Settings** add a key or **Sign in**.

          **Update:** unzip the new version over the same folder, replacing its files (Windows' Extract All suggests a new folder named after the zip: change it to the one you loaded; on macOS or Linux, \`unzip -o $ASSET -d FOLDER\`), then click **Reload** on Spindle's card in the extensions page. Reload stops the turns running in the browser; they show as interrupted, and Continue goes on. The browser derives an unpacked extension's id from its folder's path, so another folder, or this one moved or renamed, is a separate install with its own threads and keys.

          This build runs commands in the browser Linux on v86. The faster wasm Linux is in builds made from source with \`SPINDLE_WASM_LINUX\` ([how](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/browser-linux.md#building-the-images)).

          \`$STORE_ASSET\` is the Chrome Web Store's build of this tag: the same extension, with ChatGPT signing in only through OpenAI's Sign in with ChatGPT (builds from source also offer ChatGPT through the Codex CLI's sign-in).

          The zip's THIRD-PARTY.md lists the other software it carries, with licenses and sources.
          EOF
          cd "$RUNNER_TEMP"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$STORE_ASSET" "$STORE_ASSET.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" "$STORE_ASSET" "$STORE_ASSET.sha256" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "Spindle for Browser $VERSION" --notes-file notes.md
          fi
