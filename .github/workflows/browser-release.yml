name: browser release

# Publishes Spindle for Browser as a zip on a GitHub release. Push a tag browser-vVERSION,
# where VERSION is spindle/chrome/manifest.json's version; the job builds the extension
# from that commit (the browser Linux included, and the wasm Linux image that
# spindle/chrome/wasm-linux/image.json pins, made by the wasm Linux workflow; the engine
# wasm optimized by a pinned Binaryen), checks the unpacked zip in Chrome
# against a scripted provider, attests where it was built, and attaches it to the
# tag's release, beside the Chrome Web Store's build of the same commit (ChatGPT signs in
# there only with OpenAI's Sign in with ChatGPT). Running it by hand on an existing tag
# builds and replaces the zips.
on:
  push:
    tags: ["browser-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing browser-v* tag to build again"
        required: true

permissions:
  contents: read

concurrency:
  group: browser-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Tested Node runtime for wasm and v86 (with zstd, for the path checks)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - name: Version from the manifest
        run: |
          version=$(node -p "require('./spindle/chrome/manifest.json').version")
          if [ "$TAG" != "browser-v$version" ]; then
            echo "tag $TAG does not name the manifest's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=spindle-browser-$version.zip" >> "$GITHUB_ENV"
          echo "STORE_ASSET=spindle-browser-store-$version.zip" >> "$GITHUB_ENV"
          echo "MINIMUM=$(node -p "require('./spindle/chrome/manifest.json').minimum_chrome_version")" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          rustup target add wasm32-unknown-unknown i686-unknown-linux-musl
          # clang compiles SQLite for wasm32 (sqlite-wasm-rs).
          sudo apt-get update
          sudo apt-get install -y clang
          # The browser Linux's boot image is made in a user namespace, which this
          # runner's AppArmor blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' spindle/embed/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$RUNNER_TEMP/wasm-bindgen"
          # Binaryen's wasm-opt for the engine wasm (chrome/build.sh), pinned.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c --quiet -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "SPINDLE_WASM_OPT=$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" >> "$GITHUB_ENV"
          # The wasm Linux image image.json pins, checked by its sha256; both zips carry it.
          spindle/chrome/wasm-linux/fetch-image.sh "$RUNNER_TEMP/wasm-linux"
          echo "SPINDLE_WASM_LINUX=$RUNNER_TEMP/wasm-linux" >> "$GITHUB_ENV"
      - name: Build
        working-directory: spindle
        run: |
          chrome/linux/build.sh
          # Python on the wasm Linux image, its files decompressed with this v86's decoder.
          node chrome/tests/wasm_linux_python.mjs "$SPINDLE_WASM_LINUX" chrome/linux/dist/v86.wasm
          chrome/build.sh "$RUNNER_TEMP/wasm-bindgen/bin/wasm-bindgen"
          cp ../LICENSE chrome/dist/LICENSE
          # The build names no directory of the machine that made it (the Linux images'
          # files read as they decompress).
          node chrome/tests/find_paths.mjs chrome/dist "$HOME" "$GITHUB_WORKSPACE"
          (cd chrome/dist && zip -q -r -X "$RUNNER_TEMP/$ASSET" .)
          (cd "$RUNNER_TEMP" && sha256sum "$ASSET" > "$ASSET.sha256")
      - name: Check the zip, unpacked, in Chrome
        working-directory: spindle
        run: |
          unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/spindle-browser"
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/extension_real.mjs "$RUNNER_TEMP/spindle-browser" --scripted
          # The focused checks on the same unpacked zip (previews, tasks, sends; a renewed
          # engine giving its memory back), and what it says it is made of: this version,
          # from sources with no changes.
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/review_browser.mjs "$RUNNER_TEMP/spindle-browser"
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/signin_vault.mjs "$RUNNER_TEMP/spindle-browser"
          node chrome/tests/vault_host.mjs
          node --expose-gc chrome/tests/engine_renew.mjs "$RUNNER_TEMP/spindle-browser/web"
          node -e '
            const build = require(process.argv[1]);
            if (build.version !== process.env.VERSION) throw new Error(`build.json says ${build.version}`);
            for (const part of ["spindle", "engine"]) if (!/^[0-9a-f]{12}$/.test(build[part])) throw new Error(`build.json ${part}: ${build[part]}`);
            if (!/^[0-9a-f]{64}$/.test(build.wasm_linux ?? "")) throw new Error(`build.json wasm_linux: ${build.wasm_linux}`);
            if (!build.wasm_opt) throw new Error("build.json: the engine wasm was not optimized (wasm_opt)");
            console.log(JSON.stringify(build));
          ' "$RUNNER_TEMP/spindle-browser/build.json"
      - name: The Chrome Web Store's build, checked in Chrome
        working-directory: spindle
        run: |
          # Without the ChatGPT sign-in through the Codex CLI's client (build.sh checks
          # none of it is in the files); everything else as the zip above.
          SPINDLE_STORE=1 chrome/build.sh "$RUNNER_TEMP/wasm-bindgen/bin/wasm-bindgen" "$RUNNER_TEMP/store-dist"
          cp ../LICENSE "$RUNNER_TEMP/store-dist/LICENSE"
          node chrome/tests/find_paths.mjs "$RUNNER_TEMP/store-dist" "$HOME" "$GITHUB_WORKSPACE"
          (cd "$RUNNER_TEMP/store-dist" && zip -q -r -X "$RUNNER_TEMP/$STORE_ASSET" .)
          (cd "$RUNNER_TEMP" && sha256sum "$STORE_ASSET" > "$STORE_ASSET.sha256")
          unzip -q "$RUNNER_TEMP/$STORE_ASSET" -d "$RUNNER_TEMP/spindle-browser-store"
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/extension_real.mjs "$RUNNER_TEMP/spindle-browser-store" --scripted
          SPINDLE_BROWSER="$(command -v google-chrome)" \
            node chrome/tests/signin_vault.mjs "$RUNNER_TEMP/spindle-browser-store"
          node -e '
            const build = require(process.argv[1]);
            if (build.version !== process.env.VERSION || build.edition !== "store") throw new Error(`build.json says ${build.version} ${build.edition}`);
            if (!/^[0-9a-f]{64}$/.test(build.wasm_linux ?? "") || !build.wasm_opt) throw new Error(`build.json: wasm_linux ${build.wasm_linux}, wasm_opt ${build.wasm_opt}`);
          ' "$RUNNER_TEMP/spindle-browser-store/build.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/${{ env.ASSET }}
            ${{ runner.temp }}/${{ env.STORE_ASSET }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Spindle for Browser $VERSION, for Chrome, Edge and Brave, built from this tag by the browser release workflow.

          **New in 0.1.10:** the wasm Linux is in every release, this one's Chrome Web Store build included: plain \`sh\`, Python 3.14 and ripgrep run there at the machine's own speed, and the v86 Linux runs the rest. The v86 Linux boots its own trimmed kernel straight onto its files, now compressed, and makes its saved state in the background right after an install or update; both Linuxes have the time zones. With page actions on, a thread reads, clicks, types into and pictures the pages it makes, in Spindle's own tab, and reads what the page's console said; screenshots take the whole page (\`full_page\`) or a set \`width\`. A task whose files the thread changed too no longer loses them all: a text file both changed on separate lines (notes, say) merges, and a file that cannot is kept beside the thread's copy. Python has Pillow on the v86 Linux. A command cut off by its limits keeps the thread's package and cache folders. Fixed: \`read_page\` with \`scroll\` (since 0.1.8 it failed at its end), and pictures of a page laid out at another size, which could repeat its visible part. The zip carries both Linuxes and is still smaller than 0.1.8's.

          **Compatibility:** as in 0.1.8, stores stay schema 20 until a step needs more than eight intents, when they widen to schema 21 (up to 256), which 0.1.7 and older refuse. The browser Linux's new image is booted once, in the background, after the update. Keep a verified backup before updating if rollback matters.

          **Verify** it before you unzip it: \`sha256sum -c $ASSET.sha256\` (on macOS, \`shasum -a 256 -c $ASSET.sha256\`; on Windows, compare \`Get-FileHash $ASSET\` with the \`.sha256\` file), or \`gh attestation verify $ASSET -R $GITHUB_REPOSITORY\`.

          **Install** (Chrome, Edge or Brave, Chromium $MINIMUM or later, on desktop):

          1. Download \`$ASSET\` and unzip it into a folder you will keep, one without the version in its name.
          2. Open \`chrome://extensions\` (in Edge, \`edge://extensions\`; in Brave, \`brave://extensions\`), turn on **Developer mode**, click **Load unpacked** and choose that folder.
          3. Pin Spindle, open its panel, and in **Settings** add a key or **Sign in**.

          **Update:** unzip the new version over the same folder, replacing its files (Windows' Extract All suggests a new folder named after the zip: change it to the one you loaded; on macOS or Linux, \`unzip -o $ASSET -d FOLDER\`), then click **Reload** on Spindle's card in the extensions page. Reload stops the turns running in the browser; they show as interrupted, and Continue goes on. The browser derives an unpacked extension's id from its folder's path, so another folder, or this one moved or renamed, is a separate install with its own threads and keys.

          Commands run in the wasm Linux when it can run them (plain \`sh\`, Python and ripgrep, at the machine's own speed) and in the browser Linux on v86 otherwise (bash, Node, git, pip, the network). Both are built in ([how they are made](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/browser-linux.md#building-the-images)).

          \`$STORE_ASSET\` is the Chrome Web Store's build of this tag: the same extension, with ChatGPT signing in only through OpenAI's Sign in with ChatGPT (the other zip and builds from source also offer ChatGPT through the Codex CLI's sign-in).

          The zip's THIRD-PARTY.md lists the other software it carries, with licenses and sources.
          EOF
          cd "$RUNNER_TEMP"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$STORE_ASSET" "$STORE_ASSET.sha256" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" "$STORE_ASSET" "$STORE_ASSET.sha256" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "Spindle for Browser $VERSION" --notes-file notes.md
          fi
