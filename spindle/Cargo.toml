[package]
name = "spindle-reference"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = ["store", "embed"]

[dependencies]

# Line tables only for compiled crates (build scripts keep their own profile): full
# debug info pushed the worker_lifecycle test binary (which runs itself as the pinned
# image worker) past the worker's 128 MiB executable bound.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev.package.spindle-store]
debug = "line-tables-only"

# The extension's engine wasm (chrome/build.sh builds it with this profile): the whole
# program optimized as one, for a smaller and faster engine in the browser. Native builds
# keep the release profile.
[profile.browser]
inherits = "release"
lto = "fat"
codegen-units = 1
