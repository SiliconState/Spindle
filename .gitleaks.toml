[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public OAuth client identifier in the provider catalog, not a credential"
regexTarget = "secret"
regexes = ['^9d1c250a-e61b-44d9-88ed-5944d1962f5e$']

[[rules.allowlists]]
description = "Synthetic task key used by bundle tests"
regexTarget = "secret"
regexes = ['^0123456789abcdef0123$']
