[package]
name = "dext-native"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["native"]
native = ["dep:image", "dep:libc", "dep:sha2", "dep:windows-sys"]
wire = ["dep:anyhow", "dep:dext-transcript", "dep:serde_json"]
strict = ["native", "tool-policy"]
tool-policy = ["dep:dext-transcript", "dep:serde", "dep:serde_json"]
tokio-process = ["native", "dep:tokio"]
provider-http = ["native", "wire", "dep:futures-util", "dep:reqwest", "dep:tokio"]

[dependencies]
anyhow = { version = "1", optional = true }
dext-transcript = { path = "../transcript", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "http2"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
dext-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
libc = { version = "0.2", optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", optional = true, features = ["process", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
    "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_SystemInformation",
] }
